<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap');
      .font-sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'IBM Plex Mono', monospace, Consolas; }
    </style>

    <!-- Dot Grid Pattern -->
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1" fill="#1C1917" fill-opacity="0.06"/>
    </pattern>

    <!-- Amaterasu Atmospheric Aura -->
    <radialGradient id="amaterasuAura" cx="72%" cy="40%" r="48%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.38"/>
      <stop offset="35%" stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#F6F4EE" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#F6F4EE" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- 1. Base Warm Alabaster Canvas -->
  <rect width="1584" height="396" fill="#F6F4EE"/>

  <!-- 2. Architectural Dot Grid -->
  <rect width="1584" height="396" fill="url(#dotGrid)"/>

  <!-- 3. Atmospheric Ambient Glow -->
  <rect width="1584" height="396" fill="url(#amaterasuAura)"/>

  <!-- 4. Hairline Architectural Division Line -->
  <line x1="480" y1="30" x2="480" y2="366" stroke="#1C1917" stroke-opacity="0.08" stroke-width="1"/>

  <!-- CONTENT GROUP (Starts at X=520 to leave full safe zone for LinkedIn PFP) -->
  <g transform="translate(520, 0)">
    
    <!-- Top Status Pill -->
    <g transform="translate(0, 52)">
      <rect width="295" height="30" rx="15" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#softShadow)"/>
      <!-- Pulsing Emerald Dot -->
      <circle cx="15" cy="15" r="3.5" fill="#10B981"/>
      <circle cx="15" cy="15" r="6" fill="#10B981" fill-opacity="0.25"/>
      <text x="27" y="19" class="font-sans" font-size="11.5" font-weight="600" fill="#0A0A0A">Available for Full-Time Roles</text>
      <text x="202" y="19" class="font-sans" font-size="11.5" font-weight="500" fill="#9CA3AF">•</text>
      <text x="214" y="19" class="font-sans" font-size="11.5" font-weight="500" fill="#6B7280">Bangalore, KA</text>
    </g>

    <!-- Main Headline -->
    <text x="0" y="142" class="font-sans" font-size="44" font-weight="800" fill="#0A0A0A" letter-spacing="-0.035em">Architecting the</text>
    <text x="0" y="190" class="font-sans" font-size="44" font-weight="800" fill="#0A0A0A" letter-spacing="-0.035em">intelligence layer.</text>
    <!-- Minimalist Emerald Accent Bar -->
    <rect x="415" y="156" width="3.5" height="34" fill="#10B981"/>

    <!-- Subtitle Description -->
    <text x="0" y="226" class="font-sans" font-size="16" font-weight="500" fill="#4B5563" letter-spacing="-0.015em">
      Production Agentic Pipelines (LangGraph) • Distributed Systems (PySpark) • Low-Latency APIs
    </text>

    <!-- Key Metrics Bento Strip -->
    <g transform="translate(0, 268)">
      <!-- Metric 1: Current Role -->
      <text x="0" y="0" class="font-mono" font-size="10" font-weight="600" fill="#9CA3AF">CURRENT ROLE</text>
      <text x="0" y="19" class="font-sans" font-size="13.5" font-weight="700" fill="#0A0A0A">Jr. AI &amp; ML Engineer</text>
      <text x="0" y="36" class="font-sans" font-size="11" font-weight="500" fill="#6B7280">D Square Consulting Services</text>

      <!-- Metric 2: Academic Record -->
      <g transform="translate(230, 0)">
        <text x="0" y="0" class="font-mono" font-size="10" font-weight="600" fill="#9CA3AF">ACADEMIC RECORD</text>
        <text x="0" y="19" class="font-sans" font-size="13.5" font-weight="700" fill="#0A0A0A">B.E. Graduate (8.71 CGPA)</text>
        <text x="0" y="36" class="font-sans" font-size="11" font-weight="500" fill="#6B7280">ECE Silicon &amp; Systems</text>
      </g>

      <!-- Metric 3: Core Stack -->
      <g transform="translate(470, 0)">
        <text x="0" y="0" class="font-mono" font-size="10" font-weight="600" fill="#9CA3AF">CORE STACK</text>
        <text x="0" y="19" class="font-sans" font-size="13.5" font-weight="700" fill="#0A0A0A">PyTorch • LangGraph • PySpark</text>
        <text x="0" y="36" class="font-sans" font-size="11" font-weight="500" fill="#6B7280">FastAPI • Django REST • Docker</text>
      </g>
    </g>

  </g>

  <!-- Bottom-Right Portfolio URL Pill Badge -->
  <g transform="translate(1310, 335)">
    <rect width="240" height="34" rx="17" fill="#FFFFFF" stroke="#000000" stroke-opacity="0.12" stroke-width="1" filter="url(#softShadow)"/>
    <circle cx="16" cy="17" r="3" fill="#10B981"/>
    <text x="28" y="21.5" class="font-mono" font-size="11.5" font-weight="600" fill="#0A0A0A">e-varun-portfolio.vercel.app ↗</text>
  </g>
</svg>
