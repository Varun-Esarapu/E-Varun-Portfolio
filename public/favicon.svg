<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="pillShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Clean Circular White Pill Stamp (Matches BDSN Status Tag) -->
  <circle cx="64" cy="64" r="60" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="3" filter="url(#pillShadow)"/>

  <!-- Geometric Minimalist Monogram 'V' -->
