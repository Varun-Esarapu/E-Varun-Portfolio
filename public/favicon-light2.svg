<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#059669" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 100% Transparent Background - Floating Architectural Glyph -->
  <!-- Left Wing (Slightly Darker for 3D Optical Fold) -->
  <path d="M 28 32 L 64 102 L 50 102 L 20 44 Z" fill="#059669"/>

  <!-- Main Right Wing (Vibrant Emerald) -->
  <path d="M 64 102 L 108 32 L 94 32 L 56 94 Z" fill="url(#emeraldGrad)" filter="url(#softShadow)"/>

  <!-- Top Apex Floating Node -->
  <circle cx="108" cy="30" r="7" fill="#10B981"/>
</svg>
