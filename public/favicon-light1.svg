<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10B981" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Warm Alabaster Rounded Squircle (Matches #F6F4EE Portfolio Palette) -->
  <rect width="128" height="128" rx="34" fill="#F6F4EE"/>
  <rect x="1" y="1" width="126" height="126" rx="33" fill="none" stroke="#E2DFD8" stroke-width="2.5"/>

  <!-- Bold Deep Black Geometric 'V' (Plus Jakarta Sans Weight) -->
  <path d="M 36 38 L 64 96 L 92 38" fill="none" stroke="#0A0A0A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Electric Emerald Status Dot (Matches Portfolio Status Pill) -->
  <circle cx="98" cy="30" r="9" fill="#10B981" filter="url(#emeraldGlow)"/>
  <circle cx="98" cy="30" r="15" fill="#10B981" fill-opacity="0.25"/>
</svg>
