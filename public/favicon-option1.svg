<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10B981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Squircle Background -->
  <rect width="128" height="128" rx="34" fill="#0A0B0E"/>

  <!-- Subtle 1px Hairline Border -->
  <rect x="1" y="1" width="126" height="126" rx="33" fill="none" stroke="#262B38" stroke-width="2"/>

  <!-- Geometric Sharp 'V' Stroke -->
  <path d="M 36 38 L 64 96 L 92 38" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Electric Emerald Telemetry Dot (Top Right) -->
  <circle cx="98" cy="30" r="8" fill="#10B981" filter="url(#softGlow)"/>
  <circle cx="98" cy="30" r="14" fill="#10B981" fill-opacity="0.25"/>
</svg>
