<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#10B981" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Squircle -->
  <rect width="128" height="128" rx="34" fill="#0A0B0E"/>
  <rect x="1" y="1" width="126" height="126" rx="33" fill="none" stroke="#262B38" stroke-width="2"/>

  <!-- Architectural Vector DAG / Routing Path -->
  <!-- Top Node (Input) -->
  <circle cx="38" cy="38" r="8" fill="#FFFFFF"/>
  
  <!-- Right Node (Branch) -->
  <circle cx="94" cy="46" r="6" fill="#94A3B8"/>

  <!-- Primary Target Node (Emerald Output) -->
  <circle cx="78" cy="92" r="10" fill="#10B981" filter="url(#emeraldGlow)"/>
  <circle cx="78" cy="92" r="16" fill="#10B981" fill-opacity="0.25"/>

  <!-- Routing Connectors -->
  <path d="M 38 46 L 38 72 Q 38 92 64 92 L 78 92" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  <path d="M 38 38 L 86 46" fill="none" stroke="#64748B" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 6"/>
</svg>
